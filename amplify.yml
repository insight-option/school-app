# Amplify Hosting build spec (Gen 2 backend + Expo web frontend).
# Backend: deploys amplify/ with `ampx pipeline-deploy` and writes amplify_outputs.json.
# Frontend: exports the Expo web bundle to dist/ (single-page app – add the SPA rewrite rule,
# see README "Hosting"). Node 22 is pinned for both phases (Expo 57 needs Node >= 20.19).
version: 1
backend:
  phases:
    preBuild:
      commands:
        - nvm install 22
        - nvm use 22
        - node --version
        - npm --version
    build:
      commands:
        - npm ci --cache .npm --prefer-offline --no-audit --no-fund
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 22
        - node --version
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*
